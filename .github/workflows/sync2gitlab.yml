name: sync2gitlab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: kujov/gitlab-sync@ec05efff6dfa33ffb5398d31caf3a256e5a9ea34 # 2.0.0
      with:
        gitlab_url: ${{secrets.GITLAB_URL}}
        username: ${{secrets.GITLAB_USERNAME}}
        gitlab_pat: ${{secrets.GITLAB_PAT}}
